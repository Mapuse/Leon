[workspace]
resolver = "2"
members = [".", "common", "lbt", "lbc", "lbm"]
default-members = [".", "common"]

[package]
name = "leon"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "lbl — Leon Bootloader is Flicker-free UEFI bootloader for Cudane"

[[bin]]
name = "lbl"
path = "src/main.rs"

[dependencies]
leon-common = { path = "common" }
uefi = { version = "0.39", features = ["alloc", "global_allocator"] }

[features]
gop-ui = []

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"
