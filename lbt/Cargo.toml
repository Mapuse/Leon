[package]
name = "lbt"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "lbt — Leon Build Tool. Discover boot entries, run the boot-manager TUI, manage boot config"

[[bin]]
name = "lbt"
path = "src/main.rs"

[dependencies]
leon-common = { path = "../common" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
libc = "0.2"
