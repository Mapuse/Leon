# Build settings for the lbl-kernel EFI-stub application.
#
# No `[build] target`: the Makefile passes `--target` explicitly (see
# kernel/Makefile). The `x86_64-unknown-uefi` target links with the standard
# UEFI linker script, so no custom linker script is needed.

[target.x86_64-unknown-uefi]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.aarch64-unknown-uefi]
rustflags = ["-C", "target-cpu=generic"]
